name: Taeglicher Preisscan

# Laeuft taeglich automatisch (07:04 Europe/Berlin, aktuell UTC+2) und laesst
# sich zusaetzlich manuell anstossen - auch aus der GitHub-App am Handy
# (Repo -> Actions -> "Taeglicher Preisscan" -> "Run workflow"). Schreibt die
# Ergebnisse nach public/scans_main.json + public/scans_kleinanzeigen.json,
# die das Preisradar-Artefakt direkt von raw.githubusercontent.com laedt -
# kein lokaler Rechner und keine Cloud-Sandbox mit blockiertem Netzwerkzugriff
# noetig, siehe scripts/scan_all.py.
on:
  schedule:
    - cron: "4 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/scan_all.py
      - name: Ergebnisse committen
        run: |
          git config user.name "fahrradpreise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/scans_main.json public/scans_kleinanzeigen.json
          git diff --staged --quiet || git commit -m "Taeglicher Preisscan $(date -u +%Y-%m-%d)"
          git push
