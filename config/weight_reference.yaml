# Referenzgewichte je Modell - kein Rateergebnis, sondern recherchierte
# Werte (Hersteller-Spezifikationsseiten und/oder Testredaktionen). main.py
# nutzt den Mittelwert aus weight_min_kg/weight_max_kg als weight_est_kg,
# wenn ein einzelnes Angebot selbst kein Gewicht nennt (weight_kg bleibt
# dann trotzdem null - die beiden Felder werden nie vermischt, siehe
# sources/base.py). Die Spanne selbst kommt in keinem Angebot an, nur der
# Mittelwert - wer die volle Spanne sehen will, findet sie hier.
#
# Stand 21.09.2026, drei Recherchedurchgaenge:
# 1) 20.09.2026: nur offizielle Herstellerseiten, strikt (5 Modelle
#    bestaetigt, siehe Git-Historie dieser Datei).
# 2) 21.09.2026 vormittags: vom Nutzer nachgereichte, deutlich
#    vollstaendigere Tabelle (Hersteller + Testredaktionen + Foren),
#    15 von 16 Modellen abgedeckt.
# 3) 21.09.2026 nachmittags: Praezisions-Nachrecherche, nachdem der
#    Nutzer zwei konkrete Fehler aus Durchgang 2 gemeldet hatte (Cube und
#    vermeintlich Bulls) und weitere Fehler vermutete - alle 16 Modelle
#    nochmal einzeln mit Kreuzpruefung (Hersteller + unabhaengige
#    Testquelle) durchgesehen. Korrigierte Werte aus Durchgang 3
#    uebernommen, unveraenderte Werte blieben aus Durchgang 2 stehen.
#
# Aufgeloester Fehler: Cube AMS Hybrid ONE44 C:68X Race hatte Durchgang 2
# faelschlich den Wert der SLT-Ausstattung eingetragen (16.2-16.8kg).
# Durchgang 3 hat fuer die exakt getrackte Race-Variante 18.8kg auf zwei
# unabhaengigen Quellen bestaetigt (cube.eu + emtb-test.com), deckt sich
# mit der eigenen Nutzer-Angabe (~18.7kg, besitzt das Rad).
#
# Aufgeloestes Missverstaendnis: der Nutzer hatte fuer Bulls Sonic EVO AM
# SX-i 24.5-26kg aus einem anderen Chat gemeldet - Durchgang 3 hat
# geklaert, dass dieser Wert zum GLEICHNAMIGEN Modell OHNE "SX" gehoert
# (Bosch CX Gen4, Vollausstattung, andere Gewichtsklasse). Fuer die exakt
# getrackte SX-i-Variante bestaetigen bulls.de UND bosch-ebike.com
# unabhaengig 18.0kg - der bisherige Wert war korrekt und blieb
# unveraendert.
#
# Bekannter, nicht aufgeloester Widerspruch: KTM Macina Scarp SX hatte
# Durchgang 1 auf ktm-bikes.at einen Einzelwert von 19.1kg (Gr. L)
# gefunden - Durchgang 2 nennt fuer dieselbe Groesse 16.5-18.1kg (je nach
# Motor-/Ausstattungsvariante Exonic/Master), Durchgang 3 hat diesen Wert
# erneut bestaetigt (mehrfach belegt). Der aktuelle Wert (16.5-18.1kg)
# gilt daher als verlaesslicher, der alte 19.1kg-Wert bleibt nur als
# Kommentar dokumentiert statt stillschweigend zu verschwinden.
#
# Simplon Rapcon Pmax SX fehlt weiterhin bewusst: nach DREI
# Rechercheversuchen (inkl. Durchgang 3, der gezielt nach
# umgangssprachlichen/abweichenden Bezeichnungen gesucht hat) gibt es bei
# Simplon fuer den Rapcon keine "SX"-Motorvariante (nur TQ HPR50, Bosch
# CX(-Race) mit 19.8-21.3kg, Pinion MGU E1.12) - die exakt getrackte
# Modellbezeichnung laesst sich nicht verifizieren. Vermutlich eine
# Verwechslung mit einem anderen Modell - beim Nutzer nachfragen, statt
# weiter zu raten.
#
# frame_size: null = Spanne gilt pauschal fuers ganze Modell (Ursache der
#   Varianz ist meist Ausstattung/Akkugroesse, nicht Rahmengroesse). Ein
#   gesetzter Wert (z.B. "L") wird nur auf Angebote mit exakt dieser
#   frame_size angewendet.

