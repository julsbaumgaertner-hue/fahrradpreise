# Referenzgewichte je Modell - kein Rateergebnis, sondern recherchierte
# Werte (Hersteller-Spezifikationsseiten und/oder Testredaktionen). main.py
# nutzt den Mittelwert aus weight_min_kg/weight_max_kg als weight_est_kg,
# wenn ein einzelnes Angebot selbst kein Gewicht nennt (weight_kg bleibt
# dann trotzdem null - die beiden Felder werden nie vermischt, siehe
# sources/base.py). Die Spanne selbst kommt in keinem Angebot an, nur der
# Mittelwert - wer die volle Spanne sehen will, findet sie hier.
#
# Stand 21.09.2026, zwei Recherchedurchgaenge:
# 1) 20.09.2026: nur offizielle Herstellerseiten, strikt (5 Modelle
#    bestaetigt, siehe Git-Historie dieser Datei).
# 2) 21.09.2026: vom Nutzer nachgereichte, deutlich vollstaendigere
#    Tabelle (Hersteller + Testredaktionen + Foren), 15 von 16 Modellen
#    abgedeckt - ersetzt Durchgang 1 komplett, da groesseres/genaueres
#    Bild (Spannen statt Einzelwert, mehrere Ausstattungsvarianten).
#
# Bekannter Widerspruch: KTM Macina Scarp SX hatte Durchgang 1 auf
# ktm-bikes.at ein einzelnes bestaetigtes Gewicht von 19.1kg (Gr. L)
# gefunden - Durchgang 2 nennt fuer dieselbe Groesse 16.5-18.1kg (variiert
# nach Motor-/Ausstattungsvariante Exonic/Master). Durchgang 2 uebernommen
# (differenzierter, mehrere Ausstattungen beruecksichtigt), der alte Wert
# bleibt hier nur als Kommentar dokumentiert statt stillschweigend zu
# verschwinden.
#
# Simplon Rapcon Pmax SX fehlt weiterhin bewusst: laut beiden
# Rechercheversuchen gibt es bei Simplon fuer den Rapcon keine "SX"-
# Motorvariante (nur TQ HPR50, Bosch CX(-Race), Pinion MGU E1.12) - die
# exakt getrackte Modellbezeichnung liess sich nicht verifizieren, daher
# kein Wert statt einer Vermutung.
#
# frame_size: null = Spanne gilt pauschal fuers ganze Modell (Ursache der
#   Varianz ist meist Ausstattung/Akkugroesse, nicht Rahmengroesse). Ein
#   gesetzter Wert (z.B. "L") wird nur auf Angebote mit exakt dieser
#   frame_size angewendet.

