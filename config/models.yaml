# Ziel-Modelle fuer den Preis-Scanner. Neue Modelle hier einfach ergaenzen -
# main.py nimmt die Modell-id als CLI-Parameter, nichts ist hart verdrahtet.
#
# search_terms: werden woertlich als Suchanfrage an die einzelnen Quellen
#   geschickt (mehrere Varianten, da der Modellname lang ist und selten exakt
#   so geschrieben wird).
# match_required: Tokens, die (fuzzy) alle im Fundtitel vorkommen muessen -
#   das ist die Kernidentitaet des Modells. "hybrid" ist hier bewusst mit
#   drin: Cube nutzt "ONE44" sowohl fuer das normale (Muskelkraft-)Fully als
#   auch fuer das E-Bike "AMS Hybrid ONE44" - ohne "hybrid" als Pflicht wuerde
#   das falsche, nicht-elektrische Modell durchrutschen.
# match_boost: Tokens, die den Score erhoehen, aber NICHT hart filtern - z.B.
#   die Akkuzahl (400X/440X/...) wechselt pro Modelljahr, andere Trims
#   (SLX/TM/Pro/C:62 statt C:68X) sollen nicht ausgeschlossen, nur niedriger
#   einsortiert werden.
# min_score: Schwelle, ab der ein Fund in der Ausgabe auftaucht (0-100).
# min_price_eur: harte Preisuntergrenze - Angebote darunter werden verworfen,
#   OHNE Preisangabe aber behalten (fehlender Preis ist kein Signal fuer
#   Zubehoer). Grund: bei diesen hochpreisigen E-MTBs (Neupreis 3000-8000 Euro)
#   sind Angebote deutlich darunter in der Praxis fast immer Einzelteile
#   (Vorbau, Lackstift, Adapterplatte, ...) oder Verleih-/Testangebote statt
#   echter Komplettrad-Verkaeufe - am 20.09.2026 live gegen alle 933 damaligen
#   Treffer geprueft, 1000 Euro hat sauber getrennt. Pro Modell einstellbar,
#   falls ein kuenftiges (guenstigeres) Modell eine andere Grenze braucht.

models:
  - id: cube-ams-hybrid-one44-c68x-race
    display_name: "Cube AMS Hybrid ONE44 C:68X Race"
    search_terms:
      - "Cube AMS Hybrid ONE44"
      - "Cube AMS Hybrid ONE44 C68X"
      - "Cube AMS Hybrid ONE44 Race"
      - "Cube AMS Hybrid"
    match_required:
      - cube
      - ams
      - hybrid
      - one44
    match_boost:
      - "68x"
      - c68x
      - race
      - "400x"
      - "440x"
    min_score: 55
    min_price_eur: 1000

  # Ab hier: vergleichbare Light-E-MTBs (Bosch SX/TQ HPR50/Fazua Ride 60 o.ae.,
  # ~18-20kg statt Full-Power-Fully mit 23-26kg) zum Cube AMS Hybrid ONE44 oben,
  # um Preise ueber Marken hinweg vergleichen zu koennen. Bei Marken, die den
  # gleichen Modellnamen auch fuer eine nicht-elektrische oder Full-Power-
  # Variante verwenden, steht das unterscheidende Suffix (onfly/exe/sl/...) als
  # EIGENES match_required-Token, nicht an den Modellnamen angehaengt - ein
  # kurzes eigenstaendiges Token trennt fuzzy zuverlaessiger als ein
  # zusammengesetztes (z.B. "exe" statt "fuel exe" gegen "Trek Fuel EX" ohne e).

  - id: canyon-neuron-onfly-cf
    display_name: "Canyon Neuron:ONfly CF"
    search_terms:
      - "Canyon Neuron ONfly"
      - "Canyon Neuron:ONfly CF"
      - "Canyon Neuron ONfly CF"
    match_required:
      - canyon
      - neuron
      - onfly
    match_boost:
      - cf
      - carbon
    min_score: 55
    min_price_eur: 1000

  - id: ktm-macina-scarp-sx
    display_name: "KTM Macina Scarp SX"
    search_terms:
      - "KTM Macina Scarp SX"
      - "KTM Macina Scarp"
      - "KTM Macina Prowler SX"
    match_required:
      - ktm
      - macina
      - scarp
      - sx
    match_boost:
      - sx
      - prowler
    min_score: 55
    min_price_eur: 1000
    # "sx" steht bewusst in BEIDEN Listen: required fuer die Bulls-Luecke
    # (siehe unten), zusaetzlich boost, weil BASE_SCORE (50) allein unter
    # min_score (55) liegt - ohne den Boost-Punkt haette der erste Fix-
    # Versuch alle echten Treffer rausgefiltert (score 50 statt 60), live
    # beim Nachscan als 0-Treffer-Regression aufgefallen und sofort korrigiert.
    # "sx" praeventiv von match_boost auf match_required gezogen (21.09.2026,
    # im Zuge der Bulls-Korrektur) - dieselbe Luecke wie bei Bulls, hier aber
    # noch keine tatsaechliche Verunreinigung gefunden: Titel-Audit zeigt
    # 0 von 23 Treffern ohne "SX" im Titel, aktueller Datenstand war schon
    # sauber. Absicherung fuer kuenftige Scans, falls KTM auch eine Nicht-SX-
    # Scarp-Variante staerker bewirbt.

  - id: bulls-sonic-evo-am-sx
    display_name: "Bulls Sonic EVO AM SX-i"
    search_terms:
      - "Bulls Sonic EVO AM"
      - "Bulls Sonic EVO AM SX-i"
      - "Bulls Sonic EVO"
    match_required:
      - bulls
      - sonic
      - evo
      - sx
    match_boost:
      - am
      - "sx-i"
      - sxi
    min_score: 55
    min_price_eur: 1000
    # "sx" war bis 21.09.2026 nur match_boost, nicht match_required - dadurch
    # sind massenhaft Angebote des ANDEREN, deutlich schwereren Bulls Sonic
    # EVO AM 1/2/3/4 (ohne SX, Bosch CX Gen4, ~24-27kg) faelschlich unter
    # diesem Modell gelandet (vom Nutzer per "Bulls Sonic EVO AM 3 Carbon"-
    # Fund entdeckt, 26,7kg laut Haendler-Datenblatt fuer genau dieses
    # Nicht-SX-Modell - passt zur bereits dokumentierten Verwechslungsgefahr
    # in weight_reference.yaml). fuzz.partial_ratio("sx", titel) liefert
    # sauber 100 fuer echte SX-Titel ("AM SX-I", "AM-SX 1") und 50 fuer die
    # Nicht-SX-Trims ("AM 1".."AM 4", "AM-SL 1/2") - unter der 75er-Schwelle,
    # live getestet, keine Fehltrennung in der Stichprobe.

  - id: flyer-uproc-slx
    display_name: "Flyer Uproc SL:X"
    search_terms:
      - "Flyer Uproc SLX"
      - "Flyer Uproc SL:X"
      - "Flyer Uproc"
    match_required:
      - flyer
      - uproc
      - slx
    match_boost: []
    min_score: 50
    min_price_eur: 1000

  # War bis 21.09.2026 "simplon-rapcon-pmax-sx" mit "pmax"+"sx" nur als
  # match_boost (nicht required) - dadurch landete der GESAMTE Rapcon-Pmax-
  # Katalog unter diesem Modell, quer durch alle drei echten Motorvarianten
  # (TQ HPR50 ~17.6-19.4kg, Bosch CX ~19.8-21.3kg, Pinion E1.12 vermutlich
  # noch schwerer) - Titel-Audit vom 21.09.2026 zeigte 0 von 70 Treffern mit
  # "SX" im Titel. Bereits in Durchgang 3 der Gewichtsrecherche festgestellt:
  # Simplon bietet den Rapcon Pmax GAR NICHT mit SX-Motor an, das war von
  # Anfang an ein Missverstaendnis der Modellbezeichnung. Umbenannt und auf
  # die tatsaechlich leichte TQ-Variante eingeschraenkt (passt als einzige
  # zur ~18-20kg-Vergleichsgruppe) - "tq" jetzt Pflicht-Token, trennt sauber
  # von "cx"/"pinion"-Titeln (keine dieser Woerter faellt unter "tq").
  - id: simplon-rapcon-pmax-tq
    display_name: "Simplon Rapcon Pmax TQ"
    search_terms:
      - "Simplon Rapcon Pmax TQ"
      - "Simplon Rapcon TQ"
      - "Simplon Rapcon Pmax"
    match_required:
      - simplon
      - rapcon
      - tq
    match_boost:
      - pmax
      - hpr50
      - hpr60
    min_score: 55
    min_price_eur: 1000

