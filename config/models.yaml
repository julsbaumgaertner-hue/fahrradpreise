# Ziel-Modelle fuer den Preis-Scanner. Neue Modelle hier einfach ergaenzen -
# main.py nimmt die Modell-id als CLI-Parameter, nichts ist hart verdrahtet.
#
# search_terms: werden woertlich als Suchanfrage an die einzelnen Quellen
#   geschickt (mehrere Varianten, da der Modellname lang ist und selten exakt
#   so geschrieben wird).
# match_required: Tokens, die (fuzzy) alle im Fundtitel vorkommen muessen -
#   das ist die Kernidentitaet des Modells. "hybrid" ist hier bewusst mit
#   drin: Cube nutzt "ONE44" sowohl fuer das normale (Muskelkraft-)Fully als
#   auch fuer das E-Bike "AMS Hybrid ONE44" - ohne "hybrid" als Pflicht wuerde
#   das falsche, nicht-elektrische Modell durchrutschen.
# match_boost: Tokens, die den Score erhoehen, aber NICHT hart filtern - z.B.
#   die Akkuzahl (400X/440X/...) wechselt pro Modelljahr, andere Trims
#   (SLX/TM/Pro/C:62 statt C:68X) sollen nicht ausgeschlossen, nur niedriger
#   einsortiert werden.
# min_score: Schwelle, ab der ein Fund in der Ausgabe auftaucht (0-100).
# min_price_eur: harte Preisuntergrenze - Angebote darunter werden verworfen,
#   OHNE Preisangabe aber behalten (fehlender Preis ist kein Signal fuer
#   Zubehoer). Grund: bei diesen hochpreisigen E-MTBs (Neupreis 3000-8000 Euro)
#   sind Angebote deutlich darunter in der Praxis fast immer Einzelteile
#   (Vorbau, Lackstift, Adapterplatte, ...) oder Verleih-/Testangebote statt
#   echter Komplettrad-Verkaeufe - am 20.09.2026 live gegen alle 933 damaligen
#   Treffer geprueft, 1000 Euro hat sauber getrennt. Pro Modell einstellbar,
#   falls ein kuenftiges (guenstigeres) Modell eine andere Grenze braucht.

models:
  - id: cube-ams-hybrid-one44-c68x-race
    display_name: "Cube AMS Hybrid ONE44 C:68X Race"
    search_terms:
      - "Cube AMS Hybrid ONE44"
      - "Cube AMS Hybrid ONE44 C68X"
      - "Cube AMS Hybrid ONE44 Race"
      - "Cube AMS Hybrid"
    match_required:
      - cube
      - ams
      - hybrid
      - one44
    match_boost:
      - "68x"
      - c68x
      - race
      - "400x"
      - "440x"
    min_score: 55
    min_price_eur: 1000

  # Ab hier: vergleichbare Light-E-MTBs (Bosch SX/TQ HPR50/Fazua Ride 60 o.ae.,
  # ~18-20kg statt Full-Power-Fully mit 23-26kg) zum Cube AMS Hybrid ONE44 oben,
  # um Preise ueber Marken hinweg vergleichen zu koennen. Bei Marken, die den
  # gleichen Modellnamen auch fuer eine nicht-elektrische oder Full-Power-
  # Variante verwenden, steht das unterscheidende Suffix (onfly/exe/sl/...) als
  # EIGENES match_required-Token, nicht an den Modellnamen angehaengt - ein
  # kurzes eigenstaendiges Token trennt fuzzy zuverlaessiger als ein
  # zusammengesetztes (z.B. "exe" statt "fuel exe" gegen "Trek Fuel EX" ohne e).

